name: Build the macOS release executable

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'obcardinal/Windows-App-AutoLogin' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTUP_TOOLCHAIN: '1.93.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the release toolchain and fetch locked dependencies
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo fetch --locked --target aarch64-apple-darwin
      - name: Build the application
        run: python3 script/build_macos_hosted_release.py
      - name: Verify the linked SDK for the native macOS appearance
        run: |
          binary=target/aarch64-apple-darwin/release/windows-app-autologin
          sdk=$(xcrun vtool -show-build "$binary" | awk '$1 == "sdk" { print $2 }')
          echo "Linked macOS SDK $sdk (26 or later required)"
          test "${sdk%%.*}" -ge 26
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-executable
          path: target/aarch64-apple-darwin/release/windows-app-autologin
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64-executable
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: windows-app-autologin
